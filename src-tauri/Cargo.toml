[package]
name = "token-usage"
version = "1.2.8"
authors = ["Eric Zhang"]
description = "A local Codex usage and task monitor"
edition = "2021"
rust-version = "1.90"

[lib]
name = "token_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri = { version = "2.8", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.13.1"
semver = "1"
url = "2"
libc = "0.2"
base64 = "0.22"
minisign-verify = "0.2"
updater-http = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.6"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
httpmock = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"

# Proc-macro/build-script dylibs must retain the symbols rustc needs to load them.
# Keep the final application stripped; this override affects build-time tools only.
[profile.release.build-override]
strip = "none"
